<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ринат & Дарина — 19.08.2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:       #fbf7f0;
  --bg-soft:  #fff7ee;
  --white:    #ffffff;
  --ink:      #1a1714;
  --ink2:     #625b53;
  --line:     rgba(26,23,20,0.1);
  --warm:     #c89f6f;
  --gold:     #d4af8c;
  --rose:     #f1d7c2;
}

html { font-size: 16px; }

body {
  font-family: 'Jost', sans-serif;
  background: linear-gradient(135deg, #fef9f3 0%, #f9ede6 50%, #f2ddc8 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

/* ── CARD ── */
.card {
  width: 100%;
  max-width: 620px;
  background: rgba(255,255,255,0.98);
  position: relative;
  animation: appear 0.9s cubic-bezier(0.16,1,0.3,1) both;
  box-shadow: 0 28px 80px rgba(26, 23, 20, 0.12);
  border-radius: 28px;
  border: 1px solid rgba(212, 175, 140, 0.2);
  overflow: hidden;
}

.card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at top left, rgba(212, 175, 140, 0.06), transparent 28%),
              radial-gradient(circle at bottom right, rgba(201, 169, 110, 0.05), transparent 22%);
  pointer-events: none;
}

.card-body {
  position: relative;
  padding: 48px 45px 40px;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(32px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── HEADER ── */
.eyebrow {
  font-family: 'Jost', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--warm);
  margin-bottom: 20px;
  opacity: 0.95;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: rgba(212, 175, 140, 0.1);
  padding: 10px 18px;
  border-radius: 999px;
  border: 1px solid rgba(212, 175, 140, 0.2);
}

.names {
  margin-bottom: 30px;
  padding: 32px 24px 28px;
  background: linear-gradient(180deg, rgba(255,255,255,0.98) 0%, rgba(247, 233, 217, 0.3) 100%);
  border: 1px solid rgba(212, 175, 140, 0.16);
  border-radius: 22px;
  position: relative;
}

.names::before {
  content: '❦';
  position: absolute;
  top: -18px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 24px;
  color: var(--warm);
  background: var(--white);
  padding: 0 10px;
}

.name {
  font-family: 'Playfair Display', serif;
  font-size: 56px;
  font-weight: 400;
  color: var(--ink);
  line-height: 1.08;
  display: block;
  letter-spacing: -0.5px;
  text-align: center;
}

.amp {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 34px;
  color: var(--warm);
  display: block;
  margin: 8px 0;
  line-height: 1;
  text-align: center;
}

/* ── DIVIDER ── */
.rule {
  height: 1.5px;
  background: linear-gradient(to right, transparent, rgba(200,159,111,0.5), transparent);
  margin: 28px 0;
}

/* ── INFO BLOCK ── */
.info-row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
  margin-bottom: 28px;
}

.info-item {
  background: linear-gradient(135deg, rgba(245, 233, 221, 0.8) 0%, rgba(250, 240, 230, 0.6) 100%);
  padding: 26px 20px;
  border: 1px solid rgba(212, 175, 140, 0.16);
  border-radius: 16px;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.info-item:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(26, 23, 20, 0.08);
}

.info-item::before {
  content: attr(data-icon);
  display: block;
  font-size: 22px;
  margin-bottom: 12px;
  opacity: 0.9;
}

.info-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--warm);
  margin-bottom: 8px;
}

.info-value {
  font-family: 'Playfair Display', serif;
  font-size: 23px;
  color: var(--ink);
  line-height: 1.3;
  font-weight: 500;
}

/* ── COPY ── */
.copy {
  font-size: 17px;
  font-weight: 400;
  color: var(--ink2);
  line-height: 1.85;
  margin-bottom: 28px;
  text-align: center;
  letter-spacing: 0.3px;
  padding: 18px 0;
  border-top: 1px solid rgba(212, 175, 140, 0.12);
  border-bottom: 1px solid rgba(212, 175, 140, 0.12);
}

/* ── RSVP ── */
.rsvp-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--warm);
  display: block;
  margin-bottom: 16px;
}

.input-wrap {
  margin-bottom: 16px;
}

.input-wrap label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 8px;
}

.input-wrap input {
  width: 100%;
  min-height: 56px;
  border: 1px solid rgba(26,23,20,0.12);
  border-radius: 14px;
  background: rgba(255,255,255,0.95);
  font-family: 'Playfair Display', serif;
  font-size: 16px;
  color: var(--ink);
  outline: none;
  transition: border-color 0.25s, box-shadow 0.25s, background-color 0.25s;
  padding: 16px 16px;
}

.input-wrap input:focus {
  border-color: rgba(26,23,20,0.26);
  box-shadow: 0 14px 28px rgba(26,23,20,0.08);
  background: #fff;
}

.input-wrap input::placeholder {
  color: rgba(26,23,20,0.45);
}

.input-wrap input.error {
  border-color: #c05c3a;
}

/* ── BUTTONS ── */
.btns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 24px;
  margin-bottom: 20px;
}

.btn {
  min-height: 52px;
  font-family: 'Jost', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  border: none;
  transition: transform 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease;
  border-radius: 12px;
}

.btn:disabled { opacity: 0.55; cursor: not-allowed; }

.btn-yes {
  background: linear-gradient(135deg, var(--ink) 0%, #2a251e 100%);
  color: #fff;
}
.btn-yes:hover:not(:disabled) {
  background: linear-gradient(135deg, #25211d 0%, #1a1714 100%);
  transform: translateY(-1px);
  box-shadow: 0 10px 22px rgba(26,23,20,0.15);
}

.btn-no {
  background: rgba(255,255,255,0.92);
  color: var(--ink);
  border: 2px solid rgba(26,23,20,0.1);
  font-weight: 700;
}
.btn-no:hover:not(:disabled) {
  background: rgba(26,23,20,0.94);
  color: #fff;
  transform: translateY(-1px);
  box-shadow: 0 10px 22px rgba(26,23,20,0.12);
}

/* ── MODAL ── */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(20,16,12,0.72);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s, visibility 0.3s;
  z-index: 50;
}

.overlay.show {
  opacity: 1;
  visibility: visible;
}

.modal {
  background: var(--white);
  width: 100%;
  max-width: 380px;
  padding: 56px 44px;
  text-align: center;
  transform: translateY(16px);
  transition: transform 0.35s cubic-bezier(0.16,1,0.3,1);
  position: relative;
  box-shadow: 0 25px 80px rgba(26, 23, 20, 0.25);
  border-radius: 26px;
}

.overlay.show .modal { transform: translateY(0); }

.modal::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: linear-gradient(to right, var(--warm), var(--gold), var(--warm));
  border-top-left-radius: 26px;
  border-top-right-radius: 26px;
}

.modal-mark {
  font-size: 32px;
  font-weight: 600;
  color: var(--warm);
  margin-bottom: 24px;
  display: block;
}

.modal h2 {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  font-weight: 400;
  color: var(--ink);
  margin-bottom: 16px;
  line-height: 1.3;
}

.modal p {
  font-size: 16px;
  font-weight: 300;
  color: var(--ink);
  line-height: 1.8;
}

/* ── RESPONSIVE ── */
@media (max-width: 620px) {
  .card-body { padding: 36px 24px 28px; }
  .name { font-size: 48px; }
  .amp { font-size: 30px; }
  .eyebrow { font-size: 10px; padding: 8px 14px; }
  .info-value { font-size: 20px; }
  .copy { font-size: 16px; }
  .btns { grid-template-columns: 1fr; gap: 10px; }
  .modal { padding: 36px 24px; }
  .modal h2 { font-size: 24px; }
  .input-wrap input { font-size: 15px; min-height: 52px; }
  .info-item { padding: 22px 18px; }
  .info-item::before { font-size: 20px; }
}

@media (max-width: 420px) {
  .card-body { padding: 28px 16px 20px; }
  .name { font-size: 42px; }
  .amp { font-size: 28px; }
  .info-row { gap: 10px; }
  .info-item { padding: 20px 16px; }
  .input-wrap input { min-height: 48px; padding: 14px 12px; }
  .eyebrow { font-size: 9px; }
  .copy { font-size: 15px; }
  .modal { padding: 28px 20px; }
}

/* ── ADMIN LINK ── */
.admin-link {
  text-align: center;
  font-size: 10px;
}

.admin-link a {
  color: var(--ink2);
  text-decoration: none;
  font-weight: 500;
  letter-spacing: 0.5px;
  opacity: 0.6;
  transition: opacity 0.2s ease;
}

.admin-link a:hover {
  opacity: 1;
  text-decoration: underline;
}
</style>
</head>
<body>

<div class="card">
  <div class="card-body">

    <p class="eyebrow">Приглашение на свадьбу</p>

    <div class="names">
      <span class="name">Ринат</span>
      <span class="amp">&amp;</span>
      <span class="name">Дарина</span>
    </div>

    <div class="info-row">
      <div class="info-item" data-icon="📅">
        <p class="info-label">Дата</p>
        <p class="info-value">14 августа<br>2026</p>
      </div>
      <div class="info-item" data-icon="📍">
        <p class="info-label">Место</p>
        <p class="info-value">Банкетный зал<br>«Империал»</p>
      </div>
    </div>

    <div class="rule"></div>

    <p class="copy">
      Мы будем счастливы видеть вас рядом<br>
      в этот особенный для нас день.
    </p>

    <span class="rsvp-label">Подтвердите присутствие</span>

    <div class="input-wrap">
      <label for="guest-name">Ваше имя и фамилия</label>
      <input type="text" id="guest-name" placeholder="Введите имя и фамилию" maxlength="60">
    </div>
    <div class="input-wrap">
      <label for="guest-count">Сколько человек придёт</label>
      <input type="number" id="guest-count" placeholder="Число гостей" min="1" max="20">
    </div>

    <div class="btns">
      <button class="btn btn-yes" id="btn-yes" onclick="respond('yes')">С удовольствием</button>
      <button class="btn btn-no"  id="btn-no"  onclick="respond('no')">Не смогу прийти</button>
    </div>
    <p class="admin-link"><a href="admin.html">Панель администратора</a></p>

  </div>
</div>

<!-- Modal -->
<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <span class="modal-mark" id="modal-mark">✓</span>
    <h2 id="modal-title">Спасибо!</h2>
    <p id="modal-text">Ваш ответ принят.</p>
  </div>
</div>

<script type="module">
import { initializeApp }                           from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey:"AIzaSyA055MX1CxBG_by9NKCS-1ezLmhi-8IfhQ",
  authDomain:"wedding-94a25.firebaseapp.com",
  databaseURL:"https://wedding-94a25-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"wedding-94a25",
  storageBucket:"wedding-94a25.firebasestorage.app",
  messagingSenderId:"294835402992",
  appId:"1:294835402992:web:af91f365b0363a63a2ea35"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

window.respond = async function(answer) {
  const nameInput  = document.getElementById('guest-name');
  const countInput = document.getElementById('guest-count');
  const name  = nameInput.value.trim();
  let count   = parseInt(countInput.value.trim(), 10);

  if (!name) {
    nameInput.classList.add('error');
    nameInput.focus();
    setTimeout(() => nameInput.classList.remove('error'), 1500);
    return;
  }

  if (answer === 'yes' && (!count || count < 1 || count > 20)) {
    countInput.classList.add('error');
    countInput.focus();
    setTimeout(() => countInput.classList.remove('error'), 1500);
    return;
  }

  if (answer === 'no') count = 0;

  document.getElementById('btn-yes').disabled = true;
  document.getElementById('btn-no').disabled  = true;

  const isYes = answer === 'yes';
  try {
    await push(ref(db, 'guests'), {
      name,
      attending: isYes,
      guests: count,
      response: isYes ? 'Приду' : 'Не приду',
      timestamp: serverTimestamp(),
      dateStr: new Date().toLocaleString('ru-RU')
    });

    document.getElementById('modal-mark').textContent = isYes ? '✓' : '○';
    document.getElementById('modal-title').textContent = `Спасибо, ${name}!`;
    document.getElementById('modal-text').textContent  = isYes
      ? `Отлично! Ждём вас и ${count} ${count === 1 ? 'человека' : 'человек'}.`
      : 'Жаль, что не получится. Ваш ответ учтён.';

    document.getElementById('overlay').classList.add('show');
    setTimeout(closeModal, 4000);
  } catch(e) {
    alert('Ошибка при отправке. Попробуйте ещё раз.');
    document.getElementById('btn-yes').disabled = false;
    document.getElementById('btn-no').disabled  = false;
  }
};

window.closeModal = function(e) {
  if (e && e.target !== document.getElementById('overlay')) return;
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('guest-name').value = '';
  document.getElementById('guest-count').value = '';
  document.getElementById('btn-yes').disabled = false;
  document.getElementById('btn-no').disabled  = false;
};
</script>
</body>
</html>
